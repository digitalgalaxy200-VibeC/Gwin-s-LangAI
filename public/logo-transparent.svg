<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Main Polyglot 'P' Gradient (Indigo to Sky Cyan) -->
    <linearGradient id="transPrimaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="40%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Golden Acoustic Resonance Gradient -->
    <linearGradient id="transGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="transGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="transShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#4338ca" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- NO BACKGROUND RECTANGLE - 100% TRANSPARENT CANVAS -->

  <!-- Emblem Group -->
  <g id="logo-mark-transparent" filter="url(#transShadow)">
    
    <!-- Outer Sonic Arc: Global Spoken Reflex (CIA frequency pattern) -->
    <path d="M 330 145 C 385 175, 420 230, 420 295 C 420 375, 360 440, 275 450" 
          fill="none" 
          stroke="url(#transPrimaryGrad)" 
          stroke-width="14" 
          stroke-linecap="round" 
          stroke-dasharray="1 18" 
          opacity="0.5"/>

    <path d="M 315 170 C 358 196, 385 240, 385 292 C 385 352, 340 405, 275 418" 
          fill="none" 
          stroke="url(#transPrimaryGrad)" 
          stroke-width="10" 
          stroke-linecap="round" 
          opacity="0.65"/>

    <!-- The Geometric Modern 'P' Spine -->
    <path d="M 160 120 
             C 172 120, 182 130, 182 142 
             L 182 390 
             C 182 402, 172 412, 160 412 
             C 148 412, 138 402, 138 390 
             L 138 142 
             C 138 130, 148 120, 160 120 Z" 
          fill="url(#transPrimaryGrad)"/>

    <!-- The Infinite Polyglot Loop Head -->
    <path d="M 160 120 
             L 270 120 
             C 340 120, 380 160, 380 220 
             C 380 280, 340 318, 270 318 
             L 182 318 
             L 182 274 
             L 268 274 
             C 314 274, 336 250, 336 220 
             C 336 190, 314 164, 268 164 
             L 160 164 Z" 
          fill="url(#transPrimaryGrad)"/>

    <!-- High-Frequency Acoustic Soundwaves -->
    <path d="M 230 200 C 245 208, 245 230, 230 238" 
          fill="none" 
          stroke="#4f46e5" 
          stroke-width="8" 
          stroke-linecap="round" 
          opacity="0.8"/>

    <path d="M 252 186 C 278 200, 278 238, 252 252" 
          fill="none" 
          stroke="#0284c7" 
          stroke-width="7" 
          stroke-linecap="round" 
          opacity="0.85"/>

    <path d="M 276 172 C 310 192, 310 246, 276 266" 
          fill="none" 
          stroke="url(#transGoldGrad)" 
          stroke-width="7" 
          stroke-linecap="round"/>

    <!-- Dynamic 4-Point Polyglot Intelligence Sparkle (Upper Right) -->
    <path d="M 370 115 
             Q 370 145, 400 145 
             Q 370 145, 370 175 
             Q 370 145, 340 145 
             Q 370 145, 370 115 Z" 
          fill="url(#transGoldGrad)" 
          filter="url(#transGlow)"/>

    <!-- Secondary Micro Sparkle -->
    <path d="M 130 100 
             Q 130 112, 142 112 
             Q 130 112, 130 124 
             Q 130 112, 118 112 
             Q 130 112, 130 100 Z" 
          fill="#0284c7" 
          opacity="0.85"/>
  </g>
</svg>
